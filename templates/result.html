<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnosis Report</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f7;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .report {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 800px;
            margin: 0 auto;
        }
        h2 {
            color: #27ae60;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8f5e9;
        }
        .diagnosis-content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #27ae60;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 25px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #219150;
        }
        .back-btn::before {
            content: "←";
            margin-right: 8px;
        }
        @media (max-width: 600px) {
            .report {
                padding: 20px;
            }
            .diagnosis-content {
                padding: 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="report">
        <h2>Diagnosis Report ({{ language }})</h2>
        <div class="diagnosis-content">{{ diagnosis.replace('\n', '<br>') | safe }}</div>
        <a href="{{ url_for('index') }}" class="back-btn">Back to Home</a>
    </div>
</body>
</html>
